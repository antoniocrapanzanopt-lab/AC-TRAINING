<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/ac-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AC" />
    <meta name="application-name" content="AC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="AC Coaching — Piattaforma Gestionale e Portale Atleta High Performance."
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>AC</title>
    <script>
      (function() {
        try {
          var mode = 'dark';
          var accent = '#eab308';
          
          var rawPrefs = localStorage.getItem('builder_athlete_theme_preferences');
          if (rawPrefs) {
            try {
              var parsed = JSON.parse(rawPrefs);
              if (parsed && typeof parsed === 'object') {
                if (parsed.mode === 'dark' || parsed.mode === 'light' || parsed.mode === 'system') {
                  mode = parsed.mode;
                }
                if (parsed.accentColor && /^#[0-9A-Fa-f]{6}$/.test(parsed.accentColor)) {
                  accent = parsed.accentColor;
                }
              }
            } catch(e) {}
          } else {
            var legacyHex = localStorage.getItem('builder_theme_primary_hex');
            if (legacyHex && /^#[0-9A-Fa-f]{6}$/.test(legacyHex)) {
              accent = legacyHex;
            }
          }

          var effectiveTheme = mode;
          if (mode === 'system') {
            effectiveTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          
          document.documentElement.setAttribute('data-theme', effectiveTheme);
          if (effectiveTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }

          var cleaned = accent.replace('#', '');
          var num = parseInt(cleaned, 16);
          var r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
          var rgb = r + ', ' + g + ', ' + b;

          var hoverR = Math.max(0, Math.floor(r * 0.85)), hoverG = Math.max(0, Math.floor(g * 0.85)), hoverB = Math.max(0, Math.floor(b * 0.85));
          var hoverHex = '#' + ((1 << 24) + (hoverR << 16) + (hoverG << 8) + hoverB).toString(16).slice(1);

          var activeR = Math.max(0, Math.floor(r * 0.70)), activeG = Math.max(0, Math.floor(g * 0.70)), activeB = Math.max(0, Math.floor(b * 0.70));
          var activeHex = '#' + ((1 << 24) + (activeR << 16) + (activeG << 8) + activeB).toString(16).slice(1);

          document.documentElement.style.setProperty('--color-primary', accent);
          document.documentElement.style.setProperty('--color-primary-hex', accent);
          document.documentElement.style.setProperty('--color-primary-rgb', rgb);
          document.documentElement.style.setProperty('--color-primary-hover', hoverHex);
          document.documentElement.style.setProperty('--color-primary-active', activeHex);
          document.documentElement.style.setProperty('--color-primary-soft', 'rgba(' + rgb + ', 0.12)');
          document.documentElement.style.setProperty('--color-focus', 'rgba(' + rgb + ', 0.4)');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#090D16] text-slate-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
