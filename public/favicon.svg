<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sfondo Arrotondato App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#eab308" stroke-width="8" stroke-opacity="0.35" />
  
  <!-- Glow Radiale Interno -->
  <circle cx="256" cy="256" r="200" fill="#eab308" fill-opacity="0.06" />

  <!-- Monogramma AC -->
  <g filter="url(#glow)">
    <text x="256" y="325" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="230" 
          font-weight="900" 
          font-style="italic"
          text-anchor="middle" 
          letter-spacing="-14"
          fill="url(#goldGrad)">
      AC
    </text>
  </g>

  <!-- Diodo / Accento High Voltage Cyan -->
  <circle cx="395" cy="155" r="16" fill="#06b6d4" />
  <circle cx="395" cy="155" r="26" fill="#06b6d4" fill-opacity="0.4" />
</svg>
